start_command_info=Скріни та короткі кліпи з Twitch-стрімів.\n\n<b>Твій список</b>\n/add <code>канал</code> - додати канал\n/list - твої канали, ті, що в ефірі, першими, з кнопками для кліпів, аудіо та скрінів\n\n<b>Команди</b>\n/clip - кліп з кожного каналу зі списку, що зараз в ефірі, або /clip <code>канал</code> для будь-якого одного\n/screenshot - скріни так само\n/cancel - зупинити все, що ще виконується\n\n<b>Фільтри</b>\n<code>/clip em.</code> - тільки канали, що починаються на <i>em</i>\n<code>/clip !em.</code> - усі інші\n\nДовжина кліпу, від 15 с до 2 хв: /list → ⚙️ Налаштування
clip_command_info=Список порожній. Додай канал: /add <b>канал</b>\nабо одразу вкажи канал: /clip <b>канал</b>
